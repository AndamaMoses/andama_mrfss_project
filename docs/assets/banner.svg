<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Onzima Dawa — pharmacy operations and Tender Copilot</title>
  <desc id="desc">Pine and brass product banner with the Onzima Dawa wordmark and a stylised operations dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081714"/>
      <stop offset="0.55" stop-color="#0F2A25"/>
      <stop offset="1" stop-color="#1B4D42"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8CE7A"/>
      <stop offset="0.6" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#9A7715"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F4F2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#06120F" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)"/>
  <circle cx="1100" cy="40" r="300" fill="url(#glow)"/>
  <circle cx="1230" cy="310" r="170" fill="#2F7A68" opacity="0.16"/>
  <path d="M0 283C220 235 420 312 640 280s410-92 640-38v98H0z" fill="#081714" opacity="0.45"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#gold)"/>

  <!-- Brand mark -->
  <g transform="translate(72 84)">
    <rect width="86" height="86" rx="24" fill="url(#gold)" filter="url(#shadow)"/>
    <rect x="1" y="1" width="84" height="84" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.38"/>
    <g transform="translate(19 19) scale(2)" fill="none" stroke="#071C17" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 13h16c0 4.2-3.6 7.5-8 7.5S4 17.2 4 13z"/>
      <path d="M13.5 3.5l5.5 5.5"/>
      <path d="M7 21h10"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="188" y="121" fill="#F4F8F6" font-size="54" font-weight="700" letter-spacing="-0.5">Onzima Dawa</text>
    <text x="190" y="154" fill="#C9A227" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="4.2">PHARMACY OPERATIONS • TENDER COPILOT</text>
  </g>
  <text x="190" y="196" fill="#C9DCD6" font-family="'Segoe UI', Arial, sans-serif" font-size="16">Point of sale, expiry-aware inventory, refill care and finance —</text>
  <text x="190" y="220" fill="#C9DCD6" font-family="'Segoe UI', Arial, sans-serif" font-size="16">one secure workspace for the shop floor and the back office.</text>

  <!-- Product chips -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600">
    <rect x="190" y="248" width="96" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="238" y="267" fill="#ECF4F1" text-anchor="middle">POS</text>
    <rect x="296" y="248" width="118" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="355" y="267" fill="#ECF4F1" text-anchor="middle">Inventory</text>
    <rect x="424" y="248" width="117" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="482" y="267" fill="#ECF4F1" text-anchor="middle">Refill care</text>
    <rect x="551" y="248" width="98" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="600" y="267" fill="#ECF4F1" text-anchor="middle">Finance</text>
  </g>

  <!-- Dashboard card -->
  <g transform="translate(790 58)" filter="url(#shadow)">
    <rect width="418" height="228" rx="20" fill="url(#card)" stroke="#C9A227" stroke-opacity="0.45"/>
    <rect x="22" y="22" width="374" height="44" rx="12" fill="#0F2A25"/>
    <circle cx="44" cy="44" r="8" fill="#C9A227"/>
    <text x="62" y="49" fill="#F4F8F6" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700">Today at a glance</text>
    <text x="376" y="49" fill="#B9CFC9" font-family="'Segoe UI', Arial, sans-serif" font-size="10" text-anchor="end">LIVE</text>

    <g font-family="'Segoe UI', Arial, sans-serif">
      <rect x="22" y="82" width="112" height="58" rx="12" fill="#ffffff" stroke="#E2E9E7"/>
      <text x="36" y="104" fill="#647773" font-size="9" font-weight="700" letter-spacing="0.8">SALES TODAY</text>
      <text x="36" y="126" fill="#16221F" font-size="19" font-weight="700">UGX 842k</text>

      <rect x="146" y="82" width="112" height="58" rx="12" fill="#ffffff" stroke="#E2E9E7"/>
      <text x="160" y="104" fill="#647773" font-size="9" font-weight="700" letter-spacing="0.8">EXPIRING</text>
      <text x="160" y="126" fill="#B7791F" font-size="19" font-weight="700">3 batches</text>

      <rect x="270" y="82" width="126" height="58" rx="12" fill="#ffffff" stroke="#E2E9E7"/>
      <text x="284" y="104" fill="#647773" font-size="9" font-weight="700" letter-spacing="0.8">REFILLS DUE</text>
      <text x="284" y="126" fill="#2e7d4f" font-size="19" font-weight="700">7 patients</text>
    </g>

    <g transform="translate(22 158)">
      <text x="0" y="10" fill="#647773" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.8">WEEKLY REVENUE</text>
      <g transform="translate(0 22)">
        <rect x="0" y="18" width="34" height="26" rx="6" fill="#E7F1EE"/>
        <rect x="46" y="8" width="34" height="36" rx="6" fill="#A9CBC1"/>
        <rect x="92" y="24" width="34" height="20" rx="6" fill="#E7F1EE"/>
        <rect x="138" y="0" width="34" height="44" rx="6" fill="url(#gold)"/>
        <rect x="184" y="12" width="34" height="32" rx="6" fill="#A9CBC1"/>
        <rect x="230" y="20" width="34" height="24" rx="6" fill="#E7F1EE"/>
        <rect x="276" y="4" width="34" height="40" rx="6" fill="#2F7A68"/>
        <rect x="322" y="14" width="34" height="30" rx="6" fill="#A9CBC1"/>
      </g>
      <path d="M0 58h374" stroke="#E2E9E7"/>
    </g>
  </g>

  <!-- Footer line -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#9FB6B0">
    <text x="72" y="315">ONZIMA CHARLES DRUG SHOP • KIREKA</text>
    <text x="1208" y="315" text-anchor="end">COMMUNION ENGINEERING SERVICES LTD • JINJA</text>
  </g>
</svg>
